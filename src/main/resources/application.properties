# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_price_monitor
spring.datasource.username=price_monitor_user
spring.datasource.password=mypassword
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=myVeryLongSecretKeyForHS512AlgorithmThatIsAtLeast64BytesLongToComplyWithRFC7518StandardsForSecureTokenGeneration12345
jwt.expiration=86400000

# Model Server
model.server.url=http://localhost:8001
model.server.api.key=your-secret-key-change-this-in-production

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:19006,http://localhost:8084
