version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: price-predictor-db
    environment:
      POSTGRES_DB: price_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - price-predictor-network

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: price-predictor-api
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/price_monitor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mypassword
      MODEL_SERVER_URL: http://backend-ml:8001
    ports:
      - "8080:8080"
    networks:
      - price-predictor-network

  backend-ml:
    build:
      context: ./backend-ml
      dockerfile: Dockerfile
    container_name: price-predictor-ml
    environment:
      DATABASE_URL: postgresql://postgres:mypassword@postgres:5432/price_monitor
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - price-predictor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: price-predictor-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    networks:
      - price-predictor-network
    environment:
      REACT_APP_API_URL: http://localhost:8080

volumes:
  postgres_data:

networks:
  price-predictor-network:
    driver: bridge