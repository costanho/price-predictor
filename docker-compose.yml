version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: price-predictor-db
    environment:
      POSTGRES_DB: ai_price_monitor
      POSTGRES_USER: price_monitor_user
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_monitor_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-ml:
    build:
      context: ./backend-ml
      dockerfile: Dockerfile
    container_name: price-predictor-ml
    environment:
      DATABASE_URL: postgresql://price_monitor_user:mypassword@postgres:5432/ai_price_monitor
      API_KEY: your-secret-key-change-this-in-production
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-ml/models:/app/models:ro

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: price-predictor-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_price_monitor
      SPRING_DATASOURCE_USERNAME: price_monitor_user
      SPRING_DATASOURCE_PASSWORD: mypassword
      ML_SERVER_URL: http://backend-ml:8001
    ports:
      - "8080:8080"
    depends_on:
      - backend-ml
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: price-predictor-ui
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  postgres_data:
